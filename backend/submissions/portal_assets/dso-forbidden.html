<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23f59d1e'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%230c1a33' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%230c1a33'/%3E%3C/svg%3E">
<title>Not authorised · Sporting Pearls Management Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Work Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;min-height:100vh;
  display:grid;place-items:center;background:#fbfaf7;color:#1a2436;
  background-image:radial-gradient(1100px 420px at 50% -160px,rgba(20,40,75,.055),transparent 70%)}
.card{max-width:460px;width:100%;margin:24px;background:#fff;border:1px solid #e7ebf2;border-radius:18px;
  box-shadow:0 2px 4px rgba(12,26,51,.05),0 22px 48px -16px rgba(12,26,51,.22);padding:38px 36px;text-align:center}
.mark{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#ffb748,#f59d1e 58%,#ec8d08);
  color:#122a52;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:22px;margin:0 auto 18px;
  box-shadow:0 8px 20px rgba(245,157,30,.42),inset 0 0 0 1.5px rgba(255,255,255,.3)}
h1{font-family:Georgia,serif;font-size:21px;color:#0c1a33;font-weight:600;margin-bottom:10px}
p{font-size:14.5px;line-height:1.65;color:#5c6a7e}
a.btn{display:inline-block;margin-top:22px;background:linear-gradient(135deg,#ffb748,#f59d1e 58%,#ec8d08);
  color:#122a52;text-decoration:none;font-weight:700;font-size:14.5px;padding:12px 26px;border-radius:11px;
  box-shadow:0 6px 16px rgba(245,157,30,.35)}
small{display:block;margin-top:16px;font-size:12px;color:#98a1b0;letter-spacing:.4px}
</style>
</head>
<body>
  <div class="card" role="alert">
    <div class="mark">SP</div>
    <h1>Not authorised</h1>
    <p>Your account does not have access to this area. If you believe you should,
    contact the academy administrator.</p>
    <a class="btn" href="/portal/">Back to the dashboard</a>
    <small>Sporting Pearls Academy · Management Portal</small>
  </div>
</body>
</html>
