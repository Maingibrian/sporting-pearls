<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temporary problem · Sporting Pearls Football Academy</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#0c1a33;--navy2:#14284b;--amber:#f59d1e;--pearl:#fbfaf7}
  html,body{height:100%}
  body{font-family:'Work Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 15% -10%,#1b3a6b 0%,var(--navy2) 42%,var(--navy) 100%);
    display:grid;place-items:center;padding:24px;color:var(--pearl);text-align:center}
  .wrap{max-width:460px}
  .mark{width:52px;height:52px;border-radius:14px;background:var(--amber);color:var(--navy);
    display:grid;place-items:center;font-family:Georgia,'Times New Roman',serif;font-weight:700;
    font-size:22px;margin:0 auto 20px;box-shadow:0 8px 22px rgba(245,157,30,.35)}
  .code{font-family:Georgia,'Times New Roman',serif;font-size:72px;font-weight:700;color:var(--amber);
    letter-spacing:2px;margin-bottom:6px}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;margin-bottom:12px}
  p{font-size:14.5px;color:#b9c2d4;line-height:1.65;margin-bottom:26px}
  .btn{display:inline-block;padding:12px 24px;border:none;border-radius:11px;background:var(--amber);
    color:#231503;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">SP</div>
    <div class="code">5&times;&times;</div>
    <h1>The site is having a moment</h1>
    <p>Something went wrong on our side. Please try again in a minute — if it keeps happening, visit the academy office in Mtwapa and we will help you in person.</p>
    <a class="btn" href="/">Back to the homepage</a>
  </div>
</body>
</html>
