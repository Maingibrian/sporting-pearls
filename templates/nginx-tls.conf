# Sporting Pearls — TLS front (HTTPS + HTTP-to-HTTPS redirect)
# Installed by:  bash install.sh --with-nginx --with-tls --domain=YOUR.DOMAIN
# Certificates:  Let's Encrypt via certbot (webroot), stored under
#                /etc/letsencrypt/live/YOUR.DOMAIN/
# Renewal:       certbot's systemd timer renews automatically; the
#                --deploy-hook below reloads nginx so new certs load.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__;

    # ACME challenges (certbot --webroot, also used by renewals)
    location ^~ /.well-known/acme-challenge/ {
        root __APP__/site;
        default_type "text/plain";
    }

    # everything else -> HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # (inline http2: works on nginx 1.18 ... current; newest logs a
    #  harmless deprecation notice)
    listen 443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Mozilla intermediate profile
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS for every proxied response (static-site HSTS is repeated in
    # location / because nginx add_header does not inherit there)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # room for player photos / form uploads
    client_max_body_size 12m;

    root __APP__/site;
    index index.html;

    access_log __APP__/logs/nginx-access.log;
    error_log  __APP__/logs/nginx-error.log;

    # branded static error pages (internal = not directly reachable)
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { internal; }
    location = /50x.html { internal; }

    # Static site headers (Phase 2; Phase 5/R27: script-src drops
    # 'unsafe-inline' — inline handlers became data-fb attributes, the
    # three inline <script> pages load external files, fonts + the
    # gsap/lenis/splittype libraries are self-hosted. style-src keeps
    # 'unsafe-inline' for inline style attributes). The Django
    # middleware sets the same headers on its own (proxied) responses.
    location / {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location /api/    { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
    location /portal/ { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
    location /admin/  { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
    location /static/ { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
    location /media/  { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
}
