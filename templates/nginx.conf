# Sporting Pearls — nginx same-origin front (port 80)
# Serves the static site directly; proxies everything dynamic to gunicorn.
#
# Phase 2: security headers for the static site (the Django app adds the
# same set to its own responses via submissions.middleware).
# Phase 5 (R27 closed): script-src drops 'unsafe-inline' — inline
# onerror= handlers became data-fb attributes (img-fallback.js), the
# three inline <script> pages load external files, and fonts + the
# gsap/lenis/splittype libraries are self-hosted. style-src keeps
# 'unsafe-inline' for inline style attributes.
#
# nginx add_header inheritance: a block that declares its own add_header
# does NOT inherit from the parent — so location / repeats the full set.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __APP__/site;
    index index.html;

    # room for player photos / form uploads (Phase 2: was missing here —
    # nginx's 1m default silently broke larger photo uploads on :80)
    client_max_body_size 12m;

    access_log __APP__/logs/nginx-access.log;
    error_log  __APP__/logs/nginx-error.log;

    # branded static error pages (internal = not directly reachable)
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { internal; }
    location = /50x.html { internal; }

    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # proxied paths: the Django middleware sets CSP/Permissions-Policy/
    # COOP/nosniff/Referrer-Policy/XFO on these responses itself
    location /api/    { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
    location /portal/ { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
    location /admin/  { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
    location /static/ { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
    location /media/  { proxy_pass http://127.0.0.1:__PORT_API__; include /etc/nginx/proxy_params; }
}
